name: Build Pomodoro Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unpack verified source
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part0{0,1,2,3,4}.txt | base64 --decode > source.tar.xz
          tar -xJf source.tar.xz
          test -s app/src/main/AndroidManifest.xml
          test -s app/src/main/java/com/pomodoro/focus/MainActivity.java
          rm source.tar.xz

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK location
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Install Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || test ${PIPESTATUS[1]} -eq 0

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Copy installer
        run: cp app/build/outputs/apk/debug/app-debug.apk PomodoroClock-v1.8-Android12.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroClock-v1.8-Android12
          path: PomodoroClock-v1.8-Android12.apk
          if-no-files-found: error
