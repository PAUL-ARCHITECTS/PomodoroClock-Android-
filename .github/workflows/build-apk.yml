name: Build Pomodoro v1.9 APK (Android 7 to 17)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Unpack original v1.8 project
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part0{0,1,2,3,4}.txt | base64 --decode > source.tar.xz
          tar -xJf source.tar.xz
          test -s app/src/main/AndroidManifest.xml

      - name: Upgrade to v1.9 (API 24–37) and build adaptive icon
        run: |
          python3 -m pip install --user pillow
          python3 scripts/upgrade-v19.py
          grep -q 'minSdk 24' app/build.gradle
          grep -q 'compileSdk 37' app/build.gradle

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          "$SDKMANAGER" "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compile Android APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PomodoroClock-v1.9-Android7-17.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PomodoroClock-v1.9-Android7-17
          path: PomodoroClock-v1.9-Android7-17.apk
          if-no-files-found: error
